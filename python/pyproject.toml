[project]
name = "shear-flow-scattering"
version = "0.1.0"
description = "NumPy port of the MATLAB code for the thesis 'Acoustic Scattering in Shear Flow'"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shear_flow_scattering"]
